# SMS + Clipboard Sync — merged module configuration.
#
# Every line is `<KEY>=<value>`. Shell sources this file, and the Java bridge
# parses it with a trivial line splitter:
#   - leading/trailing whitespace is trimmed, blank lines and lines starting
#     with `#` are skipped
#   - the value is everything after the FIRST `=`, with one matching pair of
#     'single' or "double" quotes removed
# So string values are single-quoted on purpose; the quotes are required
# because the shell must never word-split or glob a URL or a token.
#
# Changes take effect WITHOUT a reboot: the bridge re-reads this file on every
# poll tick (即时生效).
#
# Do not share this file or the module ZIP — it carries this device's token.

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
# The server fills this in when it generates your personalized package, so there
# is normally nothing to edit here.
#
# If you are filling it in by hand, prefer the IP-literal form over a hostname:
# the module runs as UID 1000/2000, and Android 16 gives those UIDs no DNS
# resolver, so a hostname can fail to resolve even though the phone's browser
# reaches it fine.
#
# Base URL only, NO trailing slash and NO /api/push suffix — the bridge appends
# the endpoint itself.
SERVER_URL=''
# Bearer token for this device, from the server's device-management page.
# auth header: Authorization: Bearer <DEVICE_TOKEN>
DEVICE_TOKEN=''
# Label shown on the server for this device.
DEVICE_NAME='Android'

# ---------------------------------------------------------------------------
# Provisioning
# ---------------------------------------------------------------------------
# Opaque provisioning id. service.sh compares it against the marker stored in
# /data/adb/clipboard-sync/provision.id; when it changes, this bundled config is
# re-copied over the saved one — that is how an updated ZIP can refresh the
# user's settings. Leave it unchanged to preserve the user's own edits.
PROVISION_ID='78c8a7f8276af02bd0b305715e12aff5'

# ---------------------------------------------------------------------------
# Switches
# ---------------------------------------------------------------------------
# Show an on-screen toast for clipboard events. 0 = off / 1 = on.
SHOW_TOAST=1

# SMS forwarding switch. 0 = off / 1 = on.
# Off is NOT "forget": the bridge still records the current max _id so that
# turning it back on forwards only NEW messages, never the whole history.
SMS_FORWARD=1

# WeCom (企业微信) group-robot push switch. 0 = off / 1 = on.
# Default OFF: the server's download page leaves the checkbox unticked, so WeCom
# is opt-in. It is also forced to 0 whenever no usable webhook is supplied, so an
# "enabled but unconfigured" state cannot happen.
WX_SWITCH=0
# WeCom group robot webhook. Filled in by the server when you tick the box.
# Must be a full https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=... URL.
WX_WEBHOOK=''

# SMS catch-up / long-poll interval in seconds. This is NOT a 1-second busy
# loop: the bridge waits on a ContentObserver and only uses this interval for
# the periodic re-check and for re-reading the config above.
SMS_POLL_SECONDS=15
